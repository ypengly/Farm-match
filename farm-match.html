<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Farm Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF3DE;
    --cream-deep:#F4E7C3;
    --leaf:#4C8358;
    --leaf-dark:#33593C;
    --leaf-pale:#DCEFDD;
    --orange:#E68A2E;
    --orange-dark:#C06B18;
    --gold:#F0B429;
    --forest:#2E3B2A;
    --white:#FFFFFF;
    --sky:#8FC7DA;
    --berry:#C4456B;
    --shadow:0 6px 0 rgba(46,59,42,0.18);
    --shadow-sm:0 3px 0 rgba(46,59,42,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:var(--forest); font-family:'Nunito',sans-serif; color:var(--forest); user-select:none;}
  #app{position:relative; width:100%; height:100%; max-width:560px; margin:0 auto; background:linear-gradient(180deg,var(--cream) 0%, var(--cream-deep) 100%); overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.4);}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .screen.hidden{display:none;}
  .reduced-motion *{transition:none !important; animation:none !important;}

  /* ---------- HUD ---------- */
  .hud{display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--leaf); box-shadow:var(--shadow-sm); flex-shrink:0; z-index:5;}
  .hud-back{background:var(--leaf-dark); border:none; color:#fff; width:38px; height:38px; border-radius:12px; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .hud-stats{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap;}
  .pill{display:flex; align-items:center; gap:4px; background:var(--white); border-radius:20px; padding:4px 10px 4px 6px; font-weight:800; font-size:13px; color:var(--forest); box-shadow:var(--shadow-sm);}
  .pill .ic{font-size:15px;}
  .lives-pill{display:flex; align-items:center; gap:2px; background:var(--white); border-radius:20px; padding:4px 10px; box-shadow:var(--shadow-sm); font-size:13px;}

  /* ---------- Buttons ---------- */
  .btn{font-family:'Baloo 2',sans-serif; font-weight:700; border:none; border-radius:16px; padding:14px 20px; font-size:17px; cursor:pointer; color:#fff; box-shadow:var(--shadow); transition:transform .08s, box-shadow .08s; letter-spacing:.2px;}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(46,59,42,0.18);}
  .btn-primary{background:linear-gradient(180deg,var(--orange) 0%, var(--orange-dark) 100%);}
  .btn-green{background:linear-gradient(180deg,var(--leaf) 0%, var(--leaf-dark) 100%);}
  .btn-gold{background:linear-gradient(180deg,var(--gold) 0%, #C6890F 100%); color:#3B2A00;}
  .btn-muted{background:linear-gradient(180deg,#9AA79A 0%, #74806F 100%);}
  .btn-sm{padding:8px 14px; font-size:13px; border-radius:12px;}
  .btn-block{width:100%; display:block;}
  .btn:disabled{opacity:.45; cursor:default;}

  /* ---------- Menu ---------- */
  .menu-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; gap:6px;}
  .menu-title{font-size:44px; color:var(--leaf-dark); margin:0; text-shadow:2px 2px 0 rgba(255,255,255,0.6);}
  .menu-tag{font-weight:700; color:var(--orange-dark); margin:0 0 22px; font-size:14px;}
  .menu-buttons{display:flex; flex-direction:column; gap:10px; width:100%; max-width:280px;}
  .field-emoji{font-size:50px; margin-bottom:4px;}

  /* ---------- Map ---------- */
  .map-scroll{flex:1; padding:20px 16px 100px; display:flex; flex-direction:column; align-items:center; gap:22px; background:repeating-linear-gradient(180deg, var(--leaf-pale) 0px, var(--leaf-pale) 120px, var(--cream-deep) 120px, var(--cream-deep) 240px);}
  .world-label{font-size:15px; font-weight:800; color:var(--leaf-dark); background:var(--white); padding:6px 16px; border-radius:20px; box-shadow:var(--shadow-sm);}
  .level-node{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; font-weight:800; color:#fff; box-shadow:var(--shadow); cursor:pointer; position:relative; font-family:'Baloo 2';}
  .level-node.done{background:linear-gradient(180deg,var(--gold),#C6890F);}
  .level-node.open{background:linear-gradient(180deg,var(--orange),var(--orange-dark)); animation:pulse 1.8s infinite;}
  .level-node.locked{background:linear-gradient(180deg,#B7BEB2,#8B948A); cursor:default;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .level-stars{position:absolute; bottom:-10px; font-size:11px; letter-spacing:-1px;}
  .map-row{display:flex; gap:26px; align-items:center;}

  /* ---------- Game screen ---------- */
  .game-top{padding:8px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--leaf-pale); flex-shrink:0;}
  .obj-chip{display:flex; align-items:center; gap:5px; background:var(--white); border-radius:14px; padding:5px 10px; font-weight:800; font-size:12px; box-shadow:var(--shadow-sm);}
  .obj-chip.met{background:var(--gold); color:#3B2A00;}
  .moves-chip{background:var(--berry); color:#fff; border-radius:14px; padding:5px 12px; font-weight:800; font-size:13px; margin-left:auto;}
  .board-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:8px; overflow:hidden;}
  .board{display:grid; gap:3px; width:min(92vw, 420px); aspect-ratio:1/1; background:rgba(46,59,42,0.12); border-radius:16px; padding:6px; box-shadow:inset 0 2px 8px rgba(0,0,0,0.15);}
  .tile{border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:min(6.5vw,26px); background:var(--white); cursor:pointer; position:relative; transition:transform .12s;}
  .tile.selected{outline:3px solid var(--gold); transform:scale(1.08); z-index:2;}
  .tile.clearing{animation:pop .22s forwards;}
  .tile.newtile{animation:dropin .25s ease-out;}
  .tile.weed{background:#DDE9D2;}
  .tile.invalid{animation:shake .3s;}
  @keyframes pop{to{transform:scale(0); opacity:0;}}
  @keyframes dropin{from{transform:translateY(-18px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .special-badge{position:absolute; bottom:-2px; right:-2px; font-size:11px;}
  .booster-tray{display:flex; gap:6px; padding:6px 10px 10px; flex-shrink:0; overflow-x:auto;}
  .booster-btn{background:var(--white); border:2px solid transparent; border-radius:12px; padding:6px 9px; display:flex; flex-direction:column; align-items:center; font-size:18px; box-shadow:var(--shadow-sm); cursor:pointer; min-width:48px;}
  .booster-btn.armed{border-color:var(--orange); background:#FFF3E0;}
  .booster-btn .cnt{font-size:11px; font-weight:800; color:var(--leaf-dark);}
  .combo-float{position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-family:'Baloo 2'; font-size:30px; color:var(--orange-dark); text-shadow:2px 2px 0 #fff; pointer-events:none; animation:comboFloat .8s forwards; z-index:10;}
  @keyframes comboFloat{0%{opacity:0; transform:translate(-50%,-30%) scale(.6);}30%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}100%{opacity:0; transform:translate(-50%,-70%) scale(1);}}

  /* ---------- Overlays ---------- */
  .overlay{position:absolute; inset:0; background:rgba(20,26,18,0.62); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.hidden{display:none;}
  .card{background:var(--cream); border-radius:22px; padding:26px 22px; width:100%; max-width:340px; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,0.25); max-height:88%; overflow-y:auto;}
  .card h2{margin:0 0 4px; color:var(--leaf-dark); font-size:26px;}
  .stars-row{font-size:34px; letter-spacing:6px; margin:10px 0;}
  .reward-row{display:flex; justify-content:center; gap:16px; margin:14px 0; font-weight:800;}
  .reward-row div{background:#fff; border-radius:12px; padding:8px 12px; box-shadow:var(--shadow-sm); font-size:14px;}
  .card .btn{margin-top:8px;}

  /* ---------- Farm ---------- */
  .farm-scroll{flex:1; padding:16px; overflow-y:auto;}
  .section-title{font-family:'Baloo 2'; font-size:18px; color:var(--leaf-dark); margin:18px 0 10px;}
  .land-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .plot{aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:#fff; text-align:center; padding:6px; box-shadow:var(--shadow-sm); cursor:pointer;}
  .plot.unlocked{background:var(--leaf-pale); color:var(--leaf-dark);}
  .plot.locked{background:#9AA79A;}
  .plot .picon{font-size:22px;}
  .building-card{display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow-sm);}
  .building-card .bicon{font-size:30px; width:44px; text-align:center;}
  .building-card .binfo{flex:1;}
  .building-card .bname{font-weight:800; font-size:14px; color:var(--forest);}
  .building-card .blevel{font-size:12px; color:var(--leaf-dark); font-weight:700;}

  /* ---------- Lists (quests/shop/achievements) ---------- */
  .list-scroll{flex:1; padding:14px 16px 30px; overflow-y:auto;}
  .quest-card, .ach-card{background:#fff; border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow-sm);}
  .quest-card .qtop, .ach-card .atop{display:flex; justify-content:space-between; align-items:center; font-weight:800; font-size:14px; margin-bottom:6px;}
  .progress-bar{height:10px; background:var(--leaf-pale); border-radius:8px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--orange)); border-radius:8px; transition:width .3s;}
  .ach-card.claimed{opacity:.55;}
  .shop-card{display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow-sm);}
  .shop-card .sicon{font-size:28px; width:40px; text-align:center;}
  .shop-card .sinfo{flex:1;}
  .shop-card .sname{font-weight:800; font-size:14px;}
  .shop-card .sdesc{font-size:11px; color:#6b7a67;}

  /* ---------- Settings ---------- */
  .settings-row{display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow-sm); font-weight:700; font-size:14px;}
  .toggle{width:48px; height:26px; border-radius:16px; background:#C7D2C2; position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--leaf);}
  .toggle .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s;}
  .toggle.on .knob{left:25px;}

  /* ---------- Daily reward ---------- */
  .daily-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0;}
  .daily-day{background:#fff; border-radius:12px; padding:8px 4px; text-align:center; font-size:11px; font-weight:800; box-shadow:var(--shadow-sm);}
  .daily-day.today{background:var(--gold); color:#3B2A00; transform:scale(1.05);}
  .daily-day.past{opacity:.45;}

  /* toast */
  .toast{position:absolute; top:64px; left:50%; transform:translateX(-50%); background:var(--forest); color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; font-size:13px; z-index:80; box-shadow:var(--shadow-sm); max-width:80%; text-align:center;}
  .toast.hidden{display:none;}

  .empty-note{color:#6b7a67; font-size:13px; text-align:center; padding:20px; font-weight:700;}
  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app">

  <!-- LOADING -->
  <div id="screen-loading" class="screen" style="align-items:center; justify-content:center; background:linear-gradient(180deg,var(--leaf),var(--leaf-dark));">
    <div style="text-align:center; color:#fff;">
      <div style="font-size:60px;">🌾</div>
      <h1 style="margin:6px 0; font-size:32px;">Farm Match</h1>
      <div style="font-weight:700; opacity:.85; font-size:13px;" id="loading-text">Planting the fields...</div>
    </div>
  </div>

  <!-- MAIN MENU -->
  <div id="screen-menu" class="screen hidden">
    <div class="hud">
      <div class="hud-stats" id="hud-stats-menu"></div>
    </div>
    <div class="menu-wrap">
      <div class="field-emoji">🌾</div>
      <h1 class="menu-title">FARM MATCH</h1>
      <p class="menu-tag">Match. Harvest. Build Your Dream Farm.</p>
      <div class="menu-buttons">
        <button class="btn btn-primary btn-block" data-nav="map">▶ PLAY</button>
        <button class="btn btn-green btn-block" data-nav="farm">🏡 MY FARM</button>
        <button class="btn btn-gold btn-block" data-nav="quests">📋 QUESTS</button>
        <button class="btn btn-green btn-block" data-nav="shop">🛒 SHOP</button>
        <button class="btn btn-primary btn-block" id="btn-daily">🎁 DAILY REWARD</button>
        <button class="btn btn-muted btn-block" data-nav="achievements">🏆 ACHIEVEMENTS</button>
        <button class="btn btn-muted btn-block" data-nav="settings">⚙️ SETTINGS</button>
      </div>
    </div>
  </div>

  <!-- LEVEL MAP -->
  <div id="screen-map" class="screen hidden">
    <div class="hud">
      <button class="hud-back" data-nav="menu">←</button>
      <div class="hud-stats" id="hud-stats-map"></div>
    </div>
    <div class="map-scroll" id="map-scroll"></div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <button class="hud-back" id="btn-pause">⏸</button>
      <div class="hud-stats" id="hud-stats-game"></div>
    </div>
    <div class="game-top" id="game-objectives"></div>
    <div class="board-wrap"><div class="board" id="board"></div></div>
    <div class="booster-tray" id="booster-tray"></div>
  </div>

  <!-- FARM -->
  <div id="screen-farm" class="screen hidden">
    <div class="hud">
      <button class="hud-back" data-nav="menu">←</button>
      <div class="hud-stats" id="hud-stats-farm"></div>
    </div>
    <div class="farm-scroll">
      <h3 class="section-title" style="margin-top:0;">🗺️ Farmland</h3>
      <div class="land-grid" id="land-grid"></div>
      <h3 class="section-title">🏗️ Buildings</h3>
      <div id="buildings-list"></div>
    </div>
  </div>

  <!-- QUESTS -->
  <div id="screen-quests" class="screen hidden">
    <div class="hud"><button class="hud-back" data-nav="menu">←</button><h3 style="color:#fff; margin:0 auto 0 8px;">Quests</h3></div>
    <div class="list-scroll" id="quests-list"></div>
  </div>

  <!-- SHOP -->
  <div id="screen-shop" class="screen hidden">
    <div class="hud">
      <button class="hud-back" data-nav="menu">←</button>
      <div class="hud-stats" id="hud-stats-shop"></div>
    </div>
    <div class="list-scroll" id="shop-list"></div>
  </div>

  <!-- ACHIEVEMENTS -->
  <div id="screen-achievements" class="screen hidden">
    <div class="hud"><button class="hud-back" data-nav="menu">←</button><h3 style="color:#fff; margin:0 auto 0 8px;">Achievements</h3></div>
    <div class="list-scroll" id="achievements-list"></div>
  </div>

  <!-- SETTINGS -->
  <div id="screen-settings" class="screen hidden">
    <div class="hud"><button class="hud-back" data-nav="menu">←</button><h3 style="color:#fff; margin:0 auto 0 8px;">Settings</h3></div>
    <div class="list-scroll" id="settings-list"></div>
  </div>

  <!-- OVERLAYS -->
  <div id="overlay-complete" class="overlay hidden">
    <div class="card">
      <h2>HARVEST COMPLETE! 🌾</h2>
      <div class="stars-row" id="complete-stars"></div>
      <div class="reward-row" id="complete-rewards"></div>
      <button class="btn btn-primary btn-block" id="btn-next-level">NEXT LEVEL ▶</button>
      <button class="btn btn-muted btn-block" id="btn-complete-farm" style="margin-top:8px;">🏡 BACK TO FARM</button>
    </div>
  </div>

  <div id="overlay-failed" class="overlay hidden">
    <div class="card">
      <h2 style="color:var(--berry);">THE HARVEST FAILED</h2>
      <div id="failed-info" style="font-weight:800; margin:10px 0;"></div>
      <button class="btn btn-primary btn-block" id="btn-retry">TRY AGAIN</button>
      <button class="btn btn-muted btn-block" id="btn-failed-map" style="margin-top:8px;">🗺️ FARM MAP</button>
    </div>
  </div>

  <div id="overlay-pause" class="overlay hidden">
    <div class="card">
      <h2>Paused</h2>
      <button class="btn btn-green btn-block" id="btn-resume" style="margin-top:12px;">RESUME</button>
      <button class="btn btn-primary btn-block" id="btn-restart" style="margin-top:8px;">RESTART</button>
      <button class="btn btn-muted btn-block" id="btn-quit" style="margin-top:8px;">QUIT LEVEL</button>
    </div>
  </div>

  <div id="overlay-daily" class="overlay hidden">
    <div class="card">
      <h2>🎁 Daily Reward</h2>
      <div class="daily-grid" id="daily-grid"></div>
      <button class="btn btn-primary btn-block" id="btn-claim-daily">CLAIM</button>
      <button class="btn btn-muted btn-block" id="btn-close-daily" style="margin-top:8px;">CLOSE</button>
    </div>
  </div>

  <div id="overlay-tutorial" class="overlay hidden">
    <div class="card">
      <div style="font-size:40px;" id="tut-emoji">🌾</div>
      <h2 id="tut-title">Welcome to your farm!</h2>
      <p id="tut-text" style="font-weight:700; color:var(--leaf-dark);"></p>
      <button class="btn btn-primary btn-block" id="btn-tut-next">GOT IT</button>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   ENGINE — crop data & match-3 core
   ========================================================= */
const CROPS = ['corn','carrot','tomato','strawberry','potato','apple'];
const CROP_EMOJI = { corn:'🌽', carrot:'🥕', tomato:'🍅', strawberry:'🍓', potato:'🥔', apple:'🍎', weed:'🌿' };
const SPECIAL_EMOJI = { 'harvester-row':'➡️', 'harvester-col':'⬇️', golden:'✨', bomb:'💣' };

const Engine = {
  randomCrop(){ return CROPS[Math.floor(Math.random()*CROPS.length)]; },
  makeCell(type){ return { type, special:null, cropType:null }; },

  buildBoard(size, weedCount){
    const board = [];
    for (let r=0;r<size;r++){
      const row = [];
      for (let c=0;c<size;c++){
        let type, tries=0;
        do{
          type = this.randomCrop();
          tries++;
        } while (tries<20 && (
          (c>=2 && row[c-1] && row[c-2] && row[c-1].type===type && row[c-2].type===type) ||
          (r>=2 && board[r-1][c].type===type && board[r-2][c].type===type)
        ));
        row.push(this.makeCell(type));
      }
      board.push(row);
    }
    // scatter weeds on non-special tiles
    let placed = 0, attempts = 0;
    while (placed < weedCount && attempts < 200){
      attempts++;
      const r = Math.floor(Math.random()*size), c = Math.floor(Math.random()*size);
      if (board[r][c].type !== 'weed'){ board[r][c].type = 'weed'; placed++; }
    }
    return board;
  },

  inBounds(board,r,c){ return r>=0 && c>=0 && r<board.length && c<board.length; },

  findMatches(board){
    const size = board.length;
    const horizRuns = [], vertRuns = [];
    for (let r=0;r<size;r++){
      let runStart=0;
      for (let c=1;c<=size;c++){
        const prev = board[r][c-1];
        const prevValid = prev && prev.type!=='weed' && !prev.special;
        const curType = c<size ? board[r][c].type : null;
        if (c===size || curType!==prev.type || !prevValid){
          const len = c-runStart;
          if (len>=3 && prevValid){
            const cells=[]; for(let cc=runStart;cc<c;cc++) cells.push([r,cc]);
            horizRuns.push({cells,type:prev.type});
          }
          runStart=c;
        }
      }
    }
    for (let c=0;c<size;c++){
      let runStart=0;
      for (let r=1;r<=size;r++){
        const prev = board[r-1][c];
        const prevValid = prev && prev.type!=='weed' && !prev.special;
        const curType = r<size ? board[r][c].type : null;
        if (r===size || curType!==prev.type || !prevValid){
          const len = r-runStart;
          if (len>=3 && prevValid){
            const cells=[]; for(let rr=runStart;rr<r;rr++) cells.push([rr,c]);
            vertRuns.push({cells,type:prev.type});
          }
          runStart=r;
        }
      }
    }
    if (!horizRuns.length && !vertRuns.length) return null;
    const key=(r,c)=>r+','+c;
    const toClear = new Set();
    const hitCount = {};
    horizRuns.concat(vertRuns).forEach(run=>run.cells.forEach(([r,c])=>{
      toClear.add(key(r,c));
      hitCount[key(r,c)] = (hitCount[key(r,c)]||0)+1;
    }));
    const specials = [];
    const used = new Set();
    Object.keys(hitCount).forEach(k=>{
      if (hitCount[k]>=2 && !used.has(k)){
        const [r,c] = k.split(',').map(Number);
        specials.push({r,c,kind:'bomb',cropType:board[r][c].type});
        used.add(k);
      }
    });
    horizRuns.concat(vertRuns).forEach(run=>{
      const mid = run.cells[Math.floor(run.cells.length/2)];
      const k = key(mid[0],mid[1]);
      if (used.has(k)) return;
      if (run.cells.length>=5){
        specials.push({r:mid[0],c:mid[1],kind:'golden',cropType:run.type});
        used.add(k);
      } else if (run.cells.length===4){
        const orientation = run.cells[0][0]===run.cells[1][0] ? 'row' : 'col';
        specials.push({r:mid[0],c:mid[1],kind:'harvester-'+orientation,cropType:run.type});
        used.add(k);
      }
    });
    return { toClear, specials };
  },

  hasPossibleMove(board){
    const size = board.length;
    for (let r=0;r<size;r++){
      for (let c=0;c<size;c++){
        if (c<size-1){
          this.swapCells(board,r,c,r,c+1);
          const m = this.findMatches(board);
          this.swapCells(board,r,c,r,c+1);
          if (m) return true;
        }
        if (r<size-1){
          this.swapCells(board,r,c,r+1,c);
          const m = this.findMatches(board);
          this.swapCells(board,r,c,r+1,c);
          if (m) return true;
        }
      }
    }
    return false;
  },

  swapCells(board,r1,c1,r2,c2){
    const t = board[r1][c1]; board[r1][c1]=board[r2][c2]; board[r2][c2]=t;
  },

  applyGravity(board){
    const size = board.length;
    const newTiles = [];
    for (let c=0;c<size;c++){
      let writeRow = size-1;
      for (let r=size-1;r>=0;r--){
        if (board[r][c] !== null){
          board[writeRow][c] = board[r][c];
          if (writeRow !== r) board[r][c] = null;
          writeRow--;
        }
      }
      for (let r=writeRow;r>=0;r--){
        board[r][c] = this.makeCell(this.randomCrop());
        newTiles.push([r,c]);
      }
    }
    return newTiles;
  }
};

/* =========================================================
   LEVELS — data-driven generator
   ========================================================= */
const Levels = {
  TOTAL: 20,
  worldFor(id){ return 'Green Meadow'; },
  generate(id){
    const idx = id-1;
    let moves = Math.max(16, 30 - Math.floor(idx*0.8));
    const cropA = CROPS[idx % CROPS.length];
    const cropB = CROPS[(idx+3) % CROPS.length];
    let objective, weeds=0;
    if (id<=5){
      objective = { type:'harvest', targets:{ [cropA]: 12 + idx*3 } };
    } else if (id<=10){
      objective = { type:'harvest', targets:{ [cropA]: 22 + (id-6)*3 } };
    } else if (id<=15){
      weeds = 4 + (id-11)*2;
      objective = { type:'harvest', targets:{ [cropA]: 14+(id-11)*2, [cropB]: 12+(id-11)*2 } };
    } else {
      weeds = 8 + (id-16)*2;
      objective = { type:'score', target: 18000 + (id-16)*5500 };
    }
    const rewardCoins = 120 + idx*30;
    const rewardXP = 35 + idx*8;
    const baseScore = objective.type==='score' ? objective.target : (14+idx)*280;
    const starThresholds = [Math.round(baseScore*0.55), Math.round(baseScore*0.8), Math.round(baseScore*1.1)];
    return { id, world:this.worldFor(id), gridSize:8, moves, objective, weeds, rewardCoins, rewardXP, starThresholds };
  }
};

/* =========================================================
   AUDIO — light webaudio beeps
   ========================================================= */
const Audio2 = {
  ctx:null,
  ensure(){ if (!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  beep(freq, dur, type){
    if (!State.settings.sound) return;
    this.ensure();
    if (!this.ctx) return;
    try{
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type||'sine';
      o.frequency.value = freq;
      g.gain.value = 0.06;
      o.connect(g); g.connect(this.ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      o.stop(this.ctx.currentTime + dur);
    }catch(e){}
  },
  select(){ this.beep(520,.08,'triangle'); },
  swap(){ this.beep(400,.1,'triangle'); },
  match(){ this.beep(660,.12,'square'); },
  combo(n){ this.beep(660 + n*60,.15,'square'); },
  special(){ this.beep(880,.18,'sawtooth'); },
  win(){ this.beep(900,.25,'triangle'); setTimeout(()=>this.beep(1200,.3,'triangle'),150); },
  fail(){ this.beep(220,.3,'sawtooth'); },
  coin(){ this.beep(1000,.08,'square'); },
  click(){ this.beep(500,.05,'sine'); },
};

function defaultState(){
  return {
    coins:400, gems:30, totalStars:0, lives:5, maxLives:5, lastLifeTime:Date.now(),
    farmXP:0, farmLevel:1,
    completedLevels:{}, // id -> {stars, score}
    boosters:{ extraMoves:0, hammer:1, rainbow:0, tractor:0, waterBucket:1 },
    buildings:{ farmhouse:1 },
    unlockedLand:[1],
    quests:[],
    questBaselines:{},
    achievementsClaimed:{},
    settings:{ music:true, sound:true, reducedMotion:false },
    daily:{ lastClaim:null, day:0 },
    stats:{ levelsCompleted:0, cropsHarvested:0, coinsEarned:0, specialsCreated:0, bestCombo:0, cropsByType:{} },
    tutorialDone:false,
    seenHarvesterTip:false,
  };
}

let State = defaultState();
let saveVersion = 'new';
let saveTimer = null;

async function loadState(){
  try{
    const res = await window.storage.get('save');
    if (res && res.value){
      const parsed = JSON.parse(res.value);
      State = Object.assign(defaultState(), parsed);
      // deep-merge nested objects that may be missing new fields
      State.boosters = Object.assign(defaultState().boosters, parsed.boosters||{});
      State.stats = Object.assign(defaultState().stats, parsed.stats||{});
      State.settings = Object.assign(defaultState().settings, parsed.settings||{});
      State.daily = Object.assign(defaultState().daily, parsed.daily||{});
    }
  }catch(e){ /* no save yet or storage unavailable */ }
}

function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 400);
}
async function doSave(){
  try{
    const body = JSON.stringify(State);
    const res = await window.storage.set('save', body);
    if (res) saveVersion = 'ok';
  }catch(e){ /* best effort */ }
}

/* =========================================================
   LIVES regeneration (1 life every 15 min, configurable)
   ========================================================= */
const LIFE_REGEN_MS = 15*60*1000;
function tickLives(){
  if (State.lives < State.maxLives){
    const elapsed = Date.now() - State.lastLifeTime;
    const gained = Math.floor(elapsed / LIFE_REGEN_MS);
    if (gained > 0){
      State.lives = Math.min(State.maxLives, State.lives+gained);
      State.lastLifeTime = Date.now();
      queueSave();
    }
  }
}
setInterval(tickLives, 20000);

   ========================================================= */
function maxUnlockedLevel(){
  let max = 1;
  for (let i=1;i<=Levels.TOTAL;i++){
    if (State.completedLevels[i]) max = Math.max(max, i+1);
  }
  return Math.min(max, Levels.TOTAL);
}

function renderMap(){
  const wrap = $('#map-scroll');
  wrap.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'world-label';
  label.textContent = '🌱 Green Meadow — Levels 1-20';
  wrap.appendChild(label);
  const unlocked = maxUnlockedLevel();
  for (let i=1;i<=Levels.TOTAL;i+=2){
    const row = document.createElement('div');
    row.className = 'map-row';
    [i, i+1].forEach(id=>{
      if (id>Levels.TOTAL) return;
      const node = document.createElement('div');
      const done = State.completedLevels[id];
      const isOpen = id===unlocked && !done;
      node.className = 'level-node ' + (done ? 'done' : (isOpen ? 'open' : (id<unlocked ? 'done' : 'locked')));
      node.innerHTML = id<=unlocked ? String(id) : '🔒';
      if (done){
        const st = document.createElement('div');
        st.className = 'level-stars';
        st.textContent = '⭐'.repeat(done.stars);
        node.appendChild(st);
      }
      if (id<=unlocked){
        node.addEventListener('click', ()=> startLevel(id));
      }
      row.appendChild(node);
    });
    wrap.appendChild(row);
  }
}

function buildingCost(b){

  if (lvl===0) return b.baseCost || 300;
  return Math.round((b.baseCost||300) * (lvl+1) * 0.8) + 200;
}
function renderFarm(){

      : `<div class="picon">🔒</div><div>${p.cost.toLocaleString()} 🪙</div>`;
    if (!unlocked){
      el.addEventListener('click', ()=>{
        if (State.coins >= p.cost){
          State.coins -= p.cost;
          State.unlockedLand.push(p.id);
          gainFarmXP(150);
          Audio2.coin();
          showToast('Plot '+p.id+' unlocked! 🎉');
          checkAchievements();

        ${lvl===0? 'Build 🪙'+cost : (lvl>=MAX_BUILDING_LEVEL? 'MAX' : 'Upgrade 🪙'+cost)}
      </button>`;

function gainFarmXP(amount){
  State.farmXP += amount;
  const need = State.farmLevel * 300;
  while (State.farmXP >= State.farmLevel*300){
    State.farmXP -= State.farmLevel*300;
    State.farmLevel++;
    showToast('🎉 Farm Level '+State.farmLevel+'!');
  }
  checkAchievements();
}

/* =========================================================
   QUESTS
   ========================================================= */
function ensureQuests(){
  while (State.quests.length < 3){
    const used = State.quests.map(q=>q.id);
    const candidates = QUEST_POOL.filter(q=>!used.includes(q.id));
    const pick = (candidates.length?candidates:QUEST_POOL)[Math.floor(Math.random()*(candidates.length?candidates.length:QUEST_POOL.length))];
    State.quests.push({ id:pick.id+'_'+Date.now()+Math.floor(Math.random()*999), defId:pick.id, baseline: State.stats[pick.statKey]||0 });
  }
}
function questDef(defId){ return QUEST_POOL.find(q=>q.id===defId); }
function renderQuests(){
  ensureQuests();
  const list = $('#quests-list'); list.innerHTML='';
  State.quests.forEach(q=>{
    const def = questDef(q.defId);
    const current = Math.max(0, (State.stats[def.statKey]||0) - q.baseline);
    const done = current >= def.target;
    const card = document.createElement('div');
    card.className = 'quest-card';
    const rewardTxt = Object.entries(def.reward).map(([k,v])=> v+' '+(k==='coins'?'🪙':'💎')).join(' ');
    card.innerHTML = `
      <div class="qtop"><span>📋 ${def.desc}</span><span>${rewardTxt}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,(current/def.target)*100)}%"></div></div>
      <div style="font-size:12px; font-weight:700; margin-top:4px; color:#6b7a67;">${Math.min(current,def.target)} / ${def.target}</div>
      ${done? '<button class="btn btn-gold btn-sm btn-block" style="margin-top:8px;">CLAIM</button>':''}
    `;
    if (done){
      card.querySelector('button').addEventListener('click', ()=>{
        applyRewards(def.reward);
        State.quests = State.quests.filter(x=>x.id!==q.id);
        ensureQuests();
        Audio2.coin();
        showToast('Quest complete! 🎉');
        renderQuests(); renderAllHuds(); queueSave();
      });
    }
    list.appendChild(card);
  });
}
function applyRewards(r){
  if (r.coins){ State.coins += r.coins; State.stats.coinsEarned += r.coins; }
  if (r.gems){ State.gems += r.gems; }
  checkAchievements();
}

      State.settings[r.key] = !State.settings[r.key];
      document.body.classList.toggle('reduced-motion', State.settings.reducedMotion);
      renderSettings(); queueSave();
    });
    list.appendChild(row);
  });
  const resetRow = document.createElement('div');
  resetRow.className = 'settings-row';
  resetRow.innerHTML = `<span>🗑️ Reset Progress</span><button class="btn btn-sm btn-muted">RESET</button>`;
  resetRow.querySelector('button').addEventListener('click', ()=>{
    if (confirm('Reset all progress? This cannot be undone.')){
      State = defaultState();
      queueSave();
      goto('menu');
      showToast('Progress reset');
    }
  });
  list.appendChild(resetRow);
}

/* =========================================================
   DAILY REWARD
   ========================================================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function canClaimDaily(){ return State.daily.lastClaim !== todayStr(); }
function openDaily(){
  const grid = $('#daily-grid'); grid.innerHTML='';
  const currentDay = (State.daily.day % 7); // 0-indexed, next reward
  DAILY_REWARDS.forEach((r,i)=>{
    const el = document.createElement('div');
    let cls = 'daily-day';
    if (i < currentDay) cls += ' past';
    if (i === currentDay) cls += ' today';
    el.className = cls;
    el.innerHTML = `Day ${i+1}<br>${r.label}`;
    grid.appendChild(el);
  });
  $('#btn-claim-daily').disabled = !canClaimDaily();
  $('#btn-claim-daily').textContent = canClaimDaily() ? 'CLAIM' : 'COME BACK TOMORROW';
  $('#overlay-daily').classList.remove('hidden');
}
$('#btn-daily').addEventListener('click', openDaily);
$('#btn-close-daily').addEventListener('click', ()=> $('#overlay-daily').classList.add('hidden'));
$('#btn-claim-daily').addEventListener('click', ()=>{
  if (!canClaimDaily()) return;
  const idx = State.daily.day % 7;
  DAILY_REWARDS[idx].apply(State);
  State.daily.lastClaim = todayStr();
  State.daily.day++;
  Audio2.win();
  showToast('Reward claimed! 🎁');
  renderAllHuds(); queueSave();
  $('#overlay-daily').classList.add('hidden');
});

/* =========================================================
   GAME — active level runtime
   ========================================================= */
let Game = null; // active runtime object

function startLevel(id){
  if (State.lives <= 0){ showToast("No lives left — wait for one to regenerate, or buy one in the Shop."); return; }
  const def = Levels.generate(id);
  Game = {
    def,
    board: Engine.buildBoard(def.gridSize, def.weeds),
    movesLeft: def.moves,
    score: 0,
    progress: {},
    weedsCleared: 0,
    combo: 0,
    selected: null,
    busy: false,
    armedBooster: null,
    startedAt: Date.now(),
  };
  Object.keys(def.objective.targets||{}).forEach(k=> Game.progress[k]=0);
  goto('game');
  renderObjectives();
  renderBoosterTray();
  renderBoard(true);
  if (id===1 && !State.tutorialDone){ runTutorial(); }
}

function objectiveMetCheck(){
  const obj = Game.def.objective;
  if (obj.type==='score') return Game.score >= obj.target;
  return Object.entries(obj.targets).every(([k,v])=> (Game.progress[k]||0) >= v);
}

function renderObjectives(){
  const wrap = $('#game-objectives');
  wrap.innerHTML = '';
  const obj = Game.def.objective;
  if (obj.type==='score'){
    const met = Game.score >= obj.target;
    const chip = document.createElement('div');
    chip.className = 'obj-chip'+(met?' met':'');
    chip.innerHTML = `⭐ ${Game.score.toLocaleString()} / ${obj.target.toLocaleString()}`;
    wrap.appendChild(chip);
  } else {
    Object.entries(obj.targets).forEach(([crop,target])=>{
      const cur = Math.min(target, Game.progress[crop]||0);
      const met = cur>=target;
      const chip = document.createElement('div');
      chip.className = 'obj-chip'+(met?' met':'');
      chip.innerHTML = `${CROP_EMOJI[crop]} ${cur}/${target}`;
      wrap.appendChild(chip);
    });
  }
  const moves = document.createElement('div');
  moves.className = 'moves-chip';
  moves.textContent = '👣 ' + Game.movesLeft;
  wrap.appendChild(moves);
}

function renderBoosterTray(){
  const tray = $('#booster-tray'); tray.innerHTML='';
  const defs = [
    {key:'extraMoves', icon:'➕', label:'+5'},
    {key:'hammer', icon:'🔨', label:'Hit'},
    {key:'rainbow', icon:'🌈', label:'Type'},
    {key:'tractor', icon:'🚜', label:'Row'},
    {key:'waterBucket', icon:'💦', label:'Area'},
  ];
  defs.forEach(d=>{
    const btn = document.createElement('div');
    btn.className = 'booster-btn' + (Game.armedBooster===d.key?' armed':'');
    btn.innerHTML = `<div>${d.icon}</div><div class="cnt">${State.boosters[d.key]||0}</div>`;
    btn.addEventListener('click', ()=> useBooster(d.key));
    tray.appendChild(btn);
  });
}

function useBooster(key){
  if (Game.busy) return;
  if (!(State.boosters[key]>0)){ showToast('None left — visit the Shop'); return; }
  if (key==='extraMoves'){
    State.boosters.extraMoves--;
    Game.movesLeft += 5;
    Audio2.special();
    showToast('+5 Moves!');
    renderObjectives(); renderBoosterTray(); queueSave();
    return;
  }
  // tile-targeted boosters arm/disarm
  Game.armedBooster = (Game.armedBooster===key) ? null : key;
  Game.selected = null;
  renderBoosterTray();
  renderBoard(false);
}

function renderBoard(initial){
  const size = Game.def.gridSize;
  const boardEl = $('#board');
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  boardEl.innerHTML = '';
  for (let r=0;r<size;r++){
    for (let c=0;c<size;c++){
      const cell = Game.board[r][c];
      const tile = document.createElement('div');
      tile.className = 'tile';
      if (cell.type==='weed') tile.classList.add('weed');
      if (Game.selected && Game.selected[0]===r && Game.selected[1]===c) tile.classList.add('selected');
      if (initial) tile.classList.add('newtile');
      tile.dataset.r = r; tile.dataset.c = c;
      const emoji = document.createElement('span');
      emoji.textContent = CROP_EMOJI[cell.type] || '❓';
      tile.appendChild(emoji);
      if (cell.special){
        const badge = document.createElement('span');
        badge.className = 'special-badge';
        badge.textContent = SPECIAL_EMOJI[cell.special] || '';
        tile.appendChild(badge);
      }
      tile.addEventListener('click', ()=> onTileClick(r,c));
      boardEl.appendChild(tile);
    }
  }
}

function onTileClick(r,c){
  if (Game.busy) return;
  Audio2.select();
  if (Game.armedBooster){
    applyTileBooster(Game.armedBooster, r, c);
    return;
  }
  if (!Game.selected){
    Game.selected = [r,c];
    renderBoard(false);
    return;
  }
  const [sr,sc] = Game.selected;
  if (sr===r && sc===c){ Game.selected=null; renderBoard(false); return; }
  const adjacent = (Math.abs(sr-r)+Math.abs(sc-c))===1;
  if (!adjacent){
    Game.selected = [r,c];
    renderBoard(false);
    return;
  }
  attemptSwap(sr,sc,r,c);
}

function applyTileBooster(key, r, c){
  State.boosters[key]--;
  Game.armedBooster = null;
  Game.busy = true;
  const size = Game.def.gridSize;
  const cellsToClear = new Set();
  if (key==='hammer'){
    cellsToClear.add(r+','+c);
  } else if (key==='tractor'){
    for (let cc=0;cc<size;cc++) cellsToClear.add(r+','+cc);
  } else if (key==='waterBucket'){
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      const rr=r+dr, cc=c+dc;
      if (Engine.inBounds(Game.board,rr,cc)) cellsToClear.add(rr+','+cc);
    }
  } else if (key==='rainbow'){
    const type = Game.board[r][c].type;
    for (let rr=0;rr<size;rr++) for (let cc=0;cc<size;cc++){
      if (Game.board[rr][cc].type===type) cellsToClear.add(rr+','+cc);
    }
  }
  clearCellsAndSettle(cellsToClear, 1).then(()=>{
    processCascade().then(()=>{
      Game.busy = false;
      renderBoosterTray();
      checkLevelEnd();
    });
  });
  Audio2.special();
}

function attemptSwap(r1,c1,r2,c2){
  Engine.swapCells(Game.board, r1,c1,r2,c2);
  const matches = Engine.findMatches(Game.board);
  if (!matches){
    Engine.swapCells(Game.board, r1,c1,r2,c2); // revert
    Game.selected = null;
    renderBoard(false);
    const el = document.querySelector(`.tile[data-r="${r2}"][data-c="${c2}"]`);
    if (el){ el.classList.add('invalid'); setTimeout(()=>el.classList.remove('invalid'),300); }
    return;
  }
  Audio2.swap();
  Game.selected = null;
  Game.busy = true;
  Game.movesLeft--;
  renderObjectives();
  processCascade().then(()=>{
    Game.busy = false;
    checkLevelEnd();
  });
}

// Processes one full cascade (may loop for chain reactions), returns a promise
function processCascade(){
  return new Promise(resolve=>{
    Game.combo = 0;
    stepCascade(resolve);
  });
}

function stepCascade(done){
  const matches = Engine.findMatches(Game.board);
  if (!matches){
    // settle: check no-move / shuffle
    if (!Engine.hasPossibleMove(Game.board)){
      showToast('Shuffling the board...');
      Game.board = Engine.buildBoard(Game.def.gridSize, Game.def.weeds);
      renderBoard(true);
    }
    renderBoard(false);
    done();
    return;
  }
  Game.combo++;
  State.stats.bestCombo = Math.max(State.stats.bestCombo, Game.combo);
  const cellSet = matches.toClear;
  // include weed neighbors of matched cells
  const extra = new Set();
  cellSet.forEach(k=>{
    const [r,c] = k.split(',').map(Number);
    [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{
      if (Engine.inBounds(Game.board,rr,cc) && Game.board[rr][cc].type==='weed') extra.add(rr+','+cc);
    });
  });
  clearCellsAndSettle(cellSet, Game.combo, matches.specials, extra).then(()=>{
    if (matches.specials.length) State.stats.specialsCreated += matches.specials.length;
    setTimeout(()=> stepCascade(done), 60);
  });
}

// clears cells (with special-effect expansion), counts objective progress, applies gravity+refill, re-renders
function clearCellsAndSettle(cellSet, comboLevel, specialsToPlace, weedConvertSet){
  return new Promise(resolve=>{
    const size = Game.def.gridSize;
    const finalClear = new Set(cellSet);
    // expand for any special tiles landing inside the clear set (chain activation)
    let changed = true, guard=0;
    while (changed && guard<40){
      changed = false; guard++;
      Array.from(finalClear).forEach(k=>{
        const [r,c] = k.split(',').map(Number);
        const cell = Game.board[r][c];
        if (cell && cell.special){
          const added = activateSpecial(cell, r, c, size);
          added.forEach(k2=>{ if (!finalClear.has(k2)){ finalClear.add(k2); changed=true; } });
        }
      });
    }
    // tally objective progress + score for crops in finalClear (skip weed cells; those handled separately)
    let gained = 0;
    finalClear.forEach(k=>{
      const [r,c] = k.split(',').map(Number);
      const cell = Game.board[r][c];
      if (!cell) return;
      if (cell.type !== 'weed'){
        gained += 10;
        Game.progress[cell.type] = (Game.progress[cell.type]||0)+1;
        State.stats.cropsHarvested++;
        State.stats.cropsByType[cell.type] = (State.stats.cropsByType[cell.type]||0)+1;
      }
    });
    if (weedConvertSet) weedConvertSet.forEach(k=>{
      const [r,c] = k.split(',').map(Number);
      if (Game.board[r][c] && Game.board[r][c].type==='weed'){
        Game.board[r][c] = Engine.makeCell(Engine.randomCrop());
        Game.weedsCleared++;
      }
    });
    Game.score += gained * comboLevel;
    if (comboLevel>=2){
      showComboFloat(comboLevel);
      Audio2.combo(comboLevel);
    } else {
      Audio2.match();
    }

    // mark clearing animation
    finalClear.forEach(k=>{
      const [r,c] = k.split(',').map(Number);
      const el = document.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`);
      if (el) el.classList.add('clearing');
    });

    const doClear = ()=>{
      finalClear.forEach(k=>{
        const [r,c] = k.split(',').map(Number);
        Game.board[r][c] = null;
      });
      // place new specials created by this match (after clearing, before gravity, so they land correctly)
      if (specialsToPlace) specialsToPlace.forEach(sp=>{
        Game.board[sp.r][sp.c] = { type:sp.cropType, special:sp.kind, cropType:sp.cropType };
      });
      Engine.applyGravity(Game.board);
      renderObjectives();
      renderBoard(false);
      resolve();
    };
    if (document.body.classList.contains('reduced-motion')) doClear();
    else setTimeout(doClear, 220);
  });
}

function activateSpecial(cell, r, c, size){
  const added = [];
  if (cell.special==='harvester-row'){
    for (let cc=0;cc<size;cc++) added.push(r+','+cc);
  } else if (cell.special==='harvester-col'){
    for (let rr=0;rr<size;rr++) added.push(rr+','+c);
  } else if (cell.special==='bomb'){
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){
      const rr=r+dr, cc=c+dc;
      if (Engine.inBounds(Game.board,rr,cc)) added.push(rr+','+cc);
    }
  } else if (cell.special==='golden'){
    const type = cell.cropType;
    for (let rr=0;rr<size;rr++) for (let cc=0;cc<size;cc++){
      if (Game.board[rr][cc] && Game.board[rr][cc].type===type) added.push(rr+','+cc);
    }
  }
  return added;
}

function showComboFloat(n){
  const wrap = $('.board-wrap');
  const el = document.createElement('div');
  el.className = 'combo-float';
  const labels = {2:'COMBO x2', 3:'COMBO x3', 4:'MEGA HARVEST!', 5:'MEGA HARVEST!'};
  el.textContent = labels[n] || ('COMBO x'+n+'!');
  wrap.style.position = 'relative';
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 800);
}

function checkLevelEnd(){
  if (objectiveMetCheck()){
    finishLevel(true);
    return;
  }
  if (Game.movesLeft<=0){
    finishLevel(false);
    return;
  }
  renderObjectives();
  renderBoard(false);
}

function computeStars(){
  const th = Game.def.starThresholds;
  let stars = 0;
  th.forEach(t=>{ if (Game.score>=t) stars++; });
  return Math.max(1, stars);
}

function finishLevel(won){
  if (won){
    const stars = computeStars();
    const prev = State.completedLevels[Game.def.id];
    const prevStars = prev ? prev.stars : 0;
    State.completedLevels[Game.def.id] = { stars: Math.max(stars, prevStars), score: Game.score };
    if (stars > prevStars) State.totalStars += (stars - prevStars);
    State.coins += Game.def.rewardCoins;
    State.stats.coinsEarned += Game.def.rewardCoins;
    State.stats.levelsCompleted++;
    gainFarmXP(Game.def.rewardXP);
    checkAchievements();
    Audio2.win();
    $('#complete-stars').textContent = '⭐'.repeat(stars) + '🌑'.repeat(3-stars);
    $('#complete-rewards').innerHTML = `
      <div>🪙 +${Game.def.rewardCoins}</div>
      <div>✨ +${Game.def.rewardXP} XP</div>
      <div>🌽 ${Object.values(Game.progress).reduce((a,b)=>a+b,0)}</div>
    `;
    $('#btn-next-level').style.display = Game.def.id < Levels.TOTAL ? 'block' : 'none';
    $('#overlay-complete').classList.remove('hidden');
  } else {
    State.lives = Math.max(0, State.lives-1);
    Audio2.fail();
    const obj = Game.def.objective;
    const objTxt = obj.type==='score'
      ? `Score: ${Game.score.toLocaleString()} / ${obj.target.toLocaleString()}`
      : Object.entries(obj.targets).map(([k,v])=>`${CROP_EMOJI[k]} ${Game.progress[k]||0}/${v}`).join('  ');
    $('#failed-info').textContent = objTxt;
    $('#overlay-failed').classList.remove('hidden');
  }
  renderAllHuds();
  queueSave();
}

$('#btn-next-level').addEventListener('click', ()=>{
  $('#overlay-complete').classList.add('hidden');
  startLevel(Game.def.id+1);
});
$('#btn-complete-farm').addEventListener('click', ()=>{
  $('#overlay-complete').classList.add('hidden');
  goto('menu');
});
$('#btn-retry').addEventListener('click', ()=>{
  $('#overlay-failed').classList.add('hidden');
  startLevel(Game.def.id);
});
$('#btn-failed-map').addEventListener('click', ()=>{
  $('#overlay-failed').classList.add('hidden');
  goto('map');
});

/* pause */
$('#btn-pause').addEventListener('click', ()=> $('#overlay-pause').classList.remove('hidden'));
$('#btn-resume').addEventListener('click', ()=> $('#overlay-pause').classList.add('hidden'));
$('#btn-restart').addEventListener('click', ()=>{
  $('#overlay-pause').classList.add('hidden');
  startLevel(Game.def.id);
});
$('#btn-quit').addEventListener('click', ()=>{
  if (confirm('Quit this level? Progress on this attempt will be lost.')){
    $('#overlay-pause').classList.add('hidden');
    goto('map');
  }
});

/* =========================================================
   TUTORIAL
   ========================================================= */
const TUTORIAL_STEPS = [
  { emoji:'🌾', title:'Welcome to your farm!', text:'Match 3 crops in a row or column to harvest them.' },
  { emoji:'🥕', title:"Let's Harvest", text:'Tap a crop, then tap a neighboring crop to swap them and make a match.' },
  { emoji:'🚜', title:'Special Crops', text:'Match 4 in a line to create a Row Harvester that clears a whole line!' },
];
let tutStep = 0;
function runTutorial(){
  tutStep = 0;
  showTutStep();
}
function showTutStep(){
  const s = TUTORIAL_STEPS[tutStep];
  $('#tut-emoji').textContent = s.emoji;
  $('#tut-title').textContent = s.title;
  $('#tut-text').textContent = s.text;
  $('#overlay-tutorial').classList.remove('hidden');
}
$('#btn-tut-next').addEventListener('click', ()=>{
  tutStep++;
  if (tutStep>=TUTORIAL_STEPS.length){
    $('#overlay-tutorial').classList.add('hidden');
    State.tutorialDone = true;
    queueSave();
  } else {
    showTutStep();
  }
});

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  $('#loading-text').textContent = 'Loading your farm...';
  await loadState();
  document.body.classList.toggle('reduced-motion', State.settings.reducedMotion);
  tickLives();
  ensureQuests();
  setTimeout(()=>{
    $('#screen-loading').classList.add('hidden');
    goto('menu');
    if (canClaimDaily() && State.daily.lastClaim !== null){
      // don't auto-pop on very first ever launch; just let the button be available
    }
  }, 600);
}
init();

})();
